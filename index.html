<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Perfect View — Digital Menu Showcase</title>
  <meta name="description" content="A showcase of digital menus designed by Perfect View for restaurants and businesses." />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,500;8..60,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

<body>

  <header class="site-header">
    <div class="wrap header-inner">
      <a class="brand" href="/" aria-label="Perfect View — Home">

        <img src="/assets/logo.webp" alt="Perfect View" class="brand-logo"> -->

        <a href="#menus">Digital Menus</a>
        <a href="#contact">Contact</a>
      </nav>

    <section class="intro wrap">

      <p class="footer-name">Perfect View</p>
      <p class="footer-tagline">Printing • Branding • Digital Solutions</p>
